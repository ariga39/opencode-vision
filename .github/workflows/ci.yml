name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install opencode CLI (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.18
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Integration tests
        run: bun test
